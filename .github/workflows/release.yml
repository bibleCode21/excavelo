name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # version is read from packageManager in package.json.
        # Specifying it again here triggers ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # pnpm 11 requires Node >= 22.13; `cache: pnpm` runs pnpm under this Node.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify build artifacts exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          ls -la main.js manifest.json styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'main.js,styles.css,manifest.json'

      - name: Extract release notes for this tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          awk -v tag="${TAG}" '
            $0 ~ "^## \\[" tag "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          # Trim leading blank lines.
          awk 'NF{p=1} p' /tmp/release-notes.md > /tmp/release-notes-trimmed.md
          mv /tmp/release-notes-trimmed.md /tmp/release-notes.md
          # An empty extraction is not a release with no news — the section is
          # missing, or has no non-blank content. gh would publish an empty body
          # and still succeed.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No release notes for ${TAG}: CHANGELOG.md has no non-blank content under a line starting '## [${TAG}]'. Refusing to publish an empty release body."
            exit 1
          fi
          echo "--- release notes for ${TAG} ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            main.js manifest.json styles.css \
            --title "v${TAG}" \
            --notes-file /tmp/release-notes.md
