name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from packageManager in package.json.
        # Specifying it again here triggers ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13; `cache: pnpm` runs pnpm under this Node.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Probe git-log
        run: node scripts/probe-git-log.mjs

      # The other five, in one step: together they run in well under a minute,
      # while probe-git-log takes minutes and earns its own step so a failure
      # there is attributable at a glance.
      - name: Probe the rest
        run: |
          node scripts/probe-settings-tab.mjs
          node scripts/probe-templates.mjs
          node scripts/probe-transform-preservation.mjs
          node scripts/probe-verify-chain.mjs
          node scripts/probe-release-metadata.mjs

      - name: Build
        run: pnpm build

      - name: Verify build artifact
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          ls -la main.js manifest.json styles.css
